<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Home Screen -->
    <section id="home-screen" class="screen active">
        <div class="container">
            <h1>🎯 Quiz Master</h1>
            <p>Challenge yourself and improve your programming knowledge.</p>

            <button id="start-btn">Start Quiz</button>
	    <button id="add-question-btn">➕ Add Question</button>
        </div>
    </section>
	<!-- Add Question Screen -->
<section id="add-question-screen" class="screen">
    <div class="container">
        <h1>➕ Add Question</h1>

        <input id="new-question" type="text" placeholder="Enter question">

        <input id="option-1" type="text" placeholder="Option 1">
        <input id="option-2" type="text" placeholder="Option 2">
        <input id="option-3" type="text" placeholder="Option 3">
        <input id="option-4" type="text" placeholder="Option 4">

        <select id="correct-answer">
            <option value="0">Correct Answer: Option 1</option>
            <option value="1">Correct Answer: Option 2</option>
            <option value="2">Correct Answer: Option 3</option>
            <option value="3">Correct Answer: Option 4</option>
        </select>

        <button id="save-question-btn">Add Question</button>
        <button id="back-home-btn">Back</button>
    </div>
</section>
    <!-- Quiz Screen -->
    <section id="quiz-screen" class="screen">

        <div class="quiz-container">

            <div class="quiz-header">
                <h2 id="question-count">Question 1 / 10</h2>

                <div class="timer">
                    ⏳ Time Left:
                    <span id="timer">15</span>s
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <!-- Question -->
            <div class="question-box">
                <h3 id="question">
                    Question will appear here...
                </h3>
            </div>

            <!-- Options -->
            <div id="options" class="options">

                <!-- Generated using JavaScript -->

            </div>

            <!-- Navigation Buttons -->
            <div class="buttons">

                <button id="prev-btn">
                    ⬅ Previous
                </button>

                <button id="next-btn">
                    Next ➜
                </button>

            </div>

        </div>

    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="screen">

        <div class="container">

            <h1>🎉 Quiz Completed!</h1>

            <h2 id="score-text">
                You scored 0 / 10
            </h2>

            <p id="percentage">
                Percentage : 0%
            </p>

            <p id="high-score">
                High Score : 0
            </p>

            <button id="restart-btn">
                Restart Quiz
            </button>

        </div>

    </section>

    <script src="questions.js"></script>
    <script src="script.js"></script>

</body>
</html>
